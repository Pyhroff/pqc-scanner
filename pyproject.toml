[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-scanner"
version = "1.0.0"
description = "Static analysis tool for detecting quantum-vulnerable cryptography and recommending NIST PQC replacements"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.2",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
pqc-scan = "pqcscanner.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
