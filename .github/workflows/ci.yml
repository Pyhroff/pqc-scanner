name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Install SARIF schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate vulnerable and clean SARIF reports against OASIS schema
        run: |
          pqc-scan scan tests/fixtures/vulnerable_rsa.py --format sarif --output /tmp/vulnerable.sarif
          pqc-scan scan tests/fixtures/clean_pqc.py --format sarif --output /tmp/clean.sarif
          pqc-scan scan tests/fixtures/vulnerable_jwt.py --format sarif --output /tmp/jwt.sarif
          python scripts/validate_sarif.py /tmp/vulnerable.sarif --expect-findings
          python scripts/validate_sarif.py /tmp/clean.sarif --expect-empty
          python scripts/validate_sarif.py /tmp/jwt.sarif --expect-findings
      - name: Evaluate curated crypto detector fixture corpus
        run: python scripts/evaluate_fixture_corpus.py --output /tmp/fixture-evaluation.json
      - name: Generate static crypto API inventory
        run: |
          pqc-scan inventory tests/fixtures --output /tmp/crypto-inventory.json
          python - <<'PY'
          import json
          with open("/tmp/crypto-inventory.json", encoding="utf-8") as handle:
              inventory = json.load(handle)
          assert inventory["schema_version"] == "1.0"
          assert inventory["observation_count"] > 0
          assert inventory["by_classification"]["quantum_broken"] > 0
          assert inventory["by_classification"]["classically_broken"] > 0
          assert inventory["by_classification"]["parameter_context_required"] > 0
          print(f"Crypto inventory passed: {inventory['observation_count']} observations across {inventory['files_parsed']} Python files")
          PY

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
